[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorcontract"
version = "0.1.0"
description = "Hardware-aware tensor-network planning and QEC graph rewrites"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "sympy>=1.11"]

[project.optional-dependencies]
torch = ["torch>=2"]
test = ["pytest>=7"]
planning = ["opt_einsum>=3.3", "cotengra>=0.6"]
visualization = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
